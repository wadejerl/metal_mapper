# mm_hub_rsyncd.conf — rsync daemon config for the Metal Mapper studies hub
# on the RTK base station Pi. Serves one flat module both head units push
# to / pull from (sync_studies.sh on each unit; see docs/studies_sync.md).
#
# Runs unprivileged as user 'rtk' (jlw_mm_hub.service): port is >1024 and
# 'use chroot' is off because chroot needs root. Field-LAN only, no creds —
# same trust model as the NTRIP caster next to it.

# No 'log file': with two units connecting every 30 s it would grow without
# bound on the SD card. Logging goes to syslog/journald (size-capped) via
# the --no-detach systemd service.
port = 8730
use chroot = no

[mm_studies]
    path = /home/rtk/mm_studies
    comment = Metal Mapper studies hub
    read only = false
